<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Birriería Ojeda, desde el 2010">
  <defs>
    <path id="arcTop" fill="none" d="M 38 100 A 62 62 0 0 1 162 100"/>
  </defs>

  <!-- Disco rojo con orilla negra muy delgada -->
  <circle cx="100" cy="100" r="98.6" fill="#d0261f" stroke="#141414" stroke-width="2.8"/>
  <!-- Guía punteada -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fff" stroke-width="1.9" stroke-dasharray="5 6"/>

  <!-- BIRRIERIA, arqueado -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700"
        letter-spacing="1.8" fill="#fff">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">BIRRIERIA</textPath>
  </text>

  <!-- OJEDA -->
  <text x="100" y="122" text-anchor="middle" fill="#fff"
        font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="900"
        letter-spacing="0.5">OJEDA</text>

  <!-- desde el 2010 -->
  <text x="100" y="147" text-anchor="middle" fill="#fff"
        font-family="Georgia, 'Times New Roman', serif" font-size="15.5" letter-spacing=".4">desde el 2010</text>

  <!-- Tacos -->
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(70,170)">
      <path d="M-12.5,-2.6 l3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5"/>
      <path d="M-12.5,-2.6 Q0,13.6 12.5,-2.6"/>
    </g>
    <g transform="translate(100,172)">
      <path d="M-12.5,-2.6 l3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5"/>
      <path d="M-12.5,-2.6 Q0,13.6 12.5,-2.6"/>
    </g>
    <g transform="translate(130,170)">
      <path d="M-12.5,-2.6 l3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5 3.1,-2.5 3.1,2.5"/>
      <path d="M-12.5,-2.6 Q0,13.6 12.5,-2.6"/>
    </g>
  </g>
</svg>
